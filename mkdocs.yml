site_name: Russian Course — Modules & Days
site_description: An 11-module thematic Russian language course (2 days per module) — listening and reading comprehension, discussion, and vocabulary review.
site_url: https://YOURUSERNAME.github.io/russian-course/
repo_url: https://github.com/YOURUSERNAME/russian-course
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - roamlinks

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - tables
  - footnotes

nav:
  - Home: index.md
  - "Free Preview — Module 0: Geography and Environment":
  - Get the Full Course: get-full-course.md
